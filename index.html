<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>صيانة سيارتي</title>
<link rel="icon" href="icon.svg" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="theme-color" content="#221D24" />
<style>
  :root {
    --bg1: #221D24; --bg2: #1A1712; --bg3: #120F0C;
    --panel: #211D26; --panel-inner: #18141C; --chip: #2A2430;
    --border: #3A3340; --track: #3E3648;
    --text: #F3ECDF; --text-mid: #D8CFC3; --text-muted: #A79C93; --text-faint: #7A7168;
    --good: #3FA76C; --good-hover: #4FBF80;
    --warn: #D9A54A; --warn-hover: #E5BD73;
    --danger: #C1443B;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg3); }
  body {
    min-height: 100vh;
    background: linear-gradient(to bottom, var(--bg1), var(--bg2) 55%, var(--bg3));
    color: var(--text);
    font-family: 'Tajawal', 'Segoe UI', sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 40px; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  .eyebrow { display: flex; align-items: center; gap: 6px; color: var(--warn); margin-bottom: 4px; }
  .eyebrow span { font-size: 11px; font-weight: 700; letter-spacing: .02em; color: var(--text-muted); }
  h1 { font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 26px; margin: 0; color: var(--text); }
  .icon-btn { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn.active { border-color: rgba(217,165,74,.5); background: rgba(217,165,74,.1); color: var(--warn); }
  .save-note { font-size: 10px; color: var(--text-muted); height: 16px; margin-top: 4px; }
  .panel { border-radius: var(--radius); border: 1px solid var(--border); background: var(--panel); padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,.2); margin-bottom: 24px; }
  .odo-row { display: flex; flex-direction: column; gap: 16px; }
  @media (min-width: 640px) { .odo-row { flex-direction: row; align-items: center; } }
  .field-label { font-size: 14px; font-weight: 700; color: var(--text-mid); display: block; margin-bottom: 8px; }
  input[type=number], input[type=text], input[type=date], input[type=email] {
    width: 100%; background: var(--panel-inner); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; color: var(--text); font-family: inherit; font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--warn); box-shadow: 0 0 0 2px rgba(217,165,74,.25); }
  .odo-input { font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 20px; }
  .stat-pair { display: flex; gap: 12px; }
  .stat-box { border-radius: 12px; border: 1px solid var(--border); background: var(--panel-inner); padding: 12px 16px;
    text-align: center; min-width: 84px; }
  .stat-box b { display: block; font-family: 'Cairo', sans-serif; font-weight: 900; font-size: 20px; }
  .stat-box small { font-size: 10px; color: var(--text-muted); }
  .email-panel { display: flex; flex-direction: column; gap: 16px; margin-bottom: 8px; }
  @media (min-width: 640px) { .email-panel { flex-direction: row; align-items: flex-end; } }
  .btn { border-radius: 12px; border: none; padding: 12px 20px; font-family: 'Tajawal', sans-serif; font-weight: 700;
    font-size: 14px; cursor: pointer; }
  .btn-primary { background: var(--good); color: #14201A; }
  .btn-primary:hover { background: var(--good-hover); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .hint { font-size: 11px; color: var(--text-faint); margin: 0 0 20px; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column;
    gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,.25); transition: background .5s, border-color .5s; }
  .card.good { background: rgba(63,167,108,.06); border-color: rgba(63,167,108,.25); }
  .card.warn { background: rgba(217,165,74,.07); border-color: rgba(217,165,74,.3); }
  .card.danger { background: rgba(193,68,59,.08); border-color: rgba(193,68,59,.35); }
  .card-head { display: flex; align-items: center; justify-content: space-between; }
  .card-title { display: flex; align-items: center; gap: 10px; }
  .card-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--chip); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--warn); flex-shrink: 0; }
  .card-title h3 { font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 16px; margin: 0; }
  .card-title p { font-size: 12px; color: var(--text-muted); margin: 2px 0 0; }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid; display: flex;
    align-items: center; gap: 4px; white-space: nowrap; }
  .badge.good { color: var(--good); background: rgba(63,167,108,.1); border-color: rgba(63,167,108,.3); }
  .badge.warn { color: var(--warn); background: rgba(217,165,74,.1); border-color: rgba(217,165,74,.3); }
  .badge.danger { color: var(--danger); background: rgba(193,68,59,.1); border-color: rgba(193,68,59,.3); }
  .stats2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: center; margin-top: -4px; }
  .stats2 small { font-size: 10px; color: var(--text-muted); }
  .stats2 b { display: block; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 17px; }
  .due-danger small, .due-danger b, .due-danger span { color: var(--danger) !important; font-weight: 700; }
  .time-row { font-size: 12px; text-align: center; margin-top: -4px; color: var(--text-muted); }
  .last-row { font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 12px;
    display: flex; align-items: center; justify-content: space-between; }
  .last-row .val { color: var(--text-mid); }
  .history-block { font-size: 12px; margin-top: -4px; }
  .history-block p { color: var(--text-faint); margin: 0 0 4px; }
  .history-row { display: flex; align-items: center; justify-content: space-between; color: var(--text-faint); opacity: .8; }
  .remind-btn { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700;
    border-radius: 12px; border: 1px solid; padding: 10px; background: transparent; cursor: pointer; font-family: inherit; }
  .remind-btn.warn { border-color: rgba(217,165,74,.4); color: var(--warn); }
  .remind-btn.danger { border-color: rgba(193,68,59,.4); color: var(--danger); }
  .action-row { display: flex; gap: 8px; }
  .mark-btn { flex: 1; font-size: 14px; font-weight: 700; border-radius: 12px; border: none; padding: 10px;
    background: var(--warn); color: #221704; cursor: pointer; font-family: inherit; }
  .mark-btn:hover { background: var(--warn-hover); }
  .mark-btn:disabled { opacity: .4; cursor: not-allowed; }
  .edit-btn { font-size: 14px; border-radius: 12px; border: 1px solid var(--border); color: var(--text-mid);
    background: transparent; padding: 10px 14px; cursor: pointer; font-family: inherit; }
  .edit-panel { display: flex; flex-direction: column; gap: 10px; background: var(--bg3); border-radius: 12px;
    padding: 14px; border: 1px solid var(--border); }
  .edit-panel label { font-size: 12px; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }
  .edit-actions { display: flex; gap: 8px; margin-top: 4px; }
  .edit-actions button { flex: 1; padding: 10px; border-radius: 10px; border: none; font-family: inherit; font-size: 14px;
    font-weight: 700; cursor: pointer; }
  .save-btn { background: var(--good); color: #14201A; }
  .save-btn:hover { background: var(--good-hover); }
  .cancel-btn { background: transparent; border: 1px solid var(--border) !important; color: var(--text-mid); }
  .footer-note { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 28px; }
  #diag { display: none; direction: rtl; color: var(--text); background: #2a1414; border: 1px solid var(--danger);
    border-radius: 12px; padding: 16px; margin: 16px; line-height: 1.8; white-space: pre-wrap; font-size: 14px; }
</style>
</head>
<body>
<div id="root">
  <div style="min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);">
    جارٍ التحميل…
  </div>
</div>
<div id="diag"></div>
<script>
window.addEventListener("error", function (e) {
  var el = document.getElementById("diag");
  el.textContent = "حدث خطأ غير متوقع في الصفحة:\n" + (e.message || e.error);
  el.style.display = "block";

<script>
"use strict";

/* ---------- Fonts (non-blocking; page works even if this fails) ---------- */
try {
  var fontLink = document.createElement("link");
  fontLink.rel = "stylesheet";
  fontLink.href = "https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Tajawal:wght@400;500;700&display=swap";
  document.head.appendChild(fontLink);
} catch (e) { /* fonts are cosmetic only, ignore failures */ }

/* ---------- Constants ---------- */
var STORAGE_KEY = "car-maintenance-state-v1";
var MAX_HISTORY = 10;
var GAUGE_ORANGE_KM = 2000;
var GAUGE_RED_KM = 500;

var ICONS = {
  oil: '<path d="M8 3h8l1.5 3.5H6.5L8 3z"/><path d="M6.5 6.5h11L19 20a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 20l1.5-13.5z"/><path d="M9.5 11.5c-1 1.2-1 2.4 0 3.2 1 .8 1 1.8 0 2.8"/><path d="M14.5 11.5c-1 1.2-1 2.4 0 3.2 1 .8 1 1.8 0 2.8"/>',
  fuel: '<path d="M5 20V6a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v14"/><path d="M4 20h11"/><path d="M14 9h2l3 3v5.5a1.5 1.5 0 0 1-3 0V15h-2"/><circle cx="8.5" cy="9.5" r="1.5"/>',
  air: '<path d="M3 8h11a2.5 2.5 0 1 0-2.5-2.5"/><path d="M3 12h15a2.5 2.5 0 1 1-2.5 2.5"/><path d="M3 16h9a2.5 2.5 0 1 1-2.5 2.5"/>',
  belt: '<circle cx="7" cy="12" r="3.2"/><circle cx="17" cy="8" r="2.4"/><circle cx="17" cy="16" r="2.4"/><path d="M9.3 10.3 14.8 8.8"/><path d="M9.3 13.7 14.8 15.2"/><path d="M17 5.6c1.8.4 3 1.4 3 2.4s-1.2 2-3 2.4"/>',
  brake: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/><path d="M12 3.5v3"/><path d="M12 17.5v3"/><path d="M20.5 12h-3"/><path d="M6.5 12h-3"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/>',
  note: '<path d="M7 3h8l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M15 3v4h4"/><path d="M8.5 12h7"/><path d="M8.5 15.5h5"/>',
  shield: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
  clipboard: '<rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2.5" width="6" height="3" rx="1"/><path d="M9 11h6"/><path d="M9 14.5h6"/><path d="M9 18h4"/>',
  gauge: '<path d="M12 3a9 9 0 0 0-9 9c0 2 .6 3.8 1.6 5.3"/><path d="M12 3a9 9 0 0 1 9 9c0 2-.6 3.8-1.6 5.3"/><path d="M12 12l4-3"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  warn: '<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/>'
};
function svgIcon(name, cls) {
  return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
    'stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || "") + '</svg>';
}

var DEFAULT_ITEMS = [
  { id: "engine-oil", name: "زيت المحرك وفلتره", icon: "oil", intervalKm: 10000, intervalYears: null, lastKm: "", lastDate: "", history: [] },
  { id: "air-filter", name: "فلتر الهواء", icon: "air", intervalKm: 15000, intervalYears: null, lastKm: "", lastDate: "", history: [] },
  { id: "fuel-filter", name: "فلتر البنزين", icon: "fuel", intervalKm: 30000, intervalYears: 5, lastKm: "", lastDate: "", history: [] },
  { id: "timing-belt", name: "حزام التوزيع", icon: "belt", intervalKm: 70000, intervalYears: 5, lastKm: "", lastDate: "", history: [] },
  { id: "brake-pads", name: "وسادات الفرامل", icon: "brake", intervalKm: 30000, intervalYears: null, lastKm: "", lastDate: "", history: [] }
];

var REMINDER_MONTHS_BEFORE = 1; // alert this many months before insurance/inspection ends
var DEFAULT_SPECIAL_ITEMS = [
  { id: "insurance", name: "التأمين السنوي", icon: "shield", kind: "insurance", price: "", startDate: "", endDate: "" },
  { id: "technical-inspection", name: "الفحص التقني", icon: "clipboard", kind: "inspection", startDate: "", endDate: "" }
];

/* ---------- Helpers ---------- */
function todayISO() { return new Date().toISOString().slice(0, 10); }
function formatKm(n) { var v = Math.round(Number(n) || 0); return v.toLocaleString("en-US"); }
function formatDateAr(iso) {
  if (!iso) return "—";
  var d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("ar-EG-u-nu-latn", { year: "numeric", month: "long", day: "numeric" });
}
function daysBetween(fromISO, toDate) {
  var from = new Date(fromISO + "T00:00:00");
  if (isNaN(from.getTime())) return null;
  var a = new Date(from); a.setHours(0,0,0,0);
  var b = new Date(toDate); b.setHours(0,0,0,0);
  return Math.floor((b - a) / 86400000);
}
function addYearsISO(fromISO, years) {
  var d = new Date(fromISO + "T00:00:00");
  if (isNaN(d.getTime())) return null;
  d.setFullYear(d.getFullYear() + years);
  return d;
}
function daysUntil(dateISO) {
  if (!dateISO) return null;
  return daysBetween(todayISO(), new Date(dateISO + "T00:00:00"));
}
function statusForDateRange(remainingDays) {
  if (remainingDays == null) return "good";
  if (remainingDays <= 0) return "danger";
  if (remainingDays <= REMINDER_MONTHS_BEFORE * 30) return "warn";
  return "good";
}
// Shows short spans in days and longer ones in months (+ leftover days),
// since "45 يومًا" is harder to read at a glance than "شهر و15 يومًا".
function formatDurationAr(totalDays) {
  totalDays = Math.max(0, Math.round(totalDays));
  if (totalDays < 30) {
    if (totalDays === 0) return "اليوم";
    if (totalDays === 1) return "يوم واحد";
    if (totalDays === 2) return "يومان";
    if (totalDays <= 10) return totalDays + " أيام";
    return totalDays + " يومًا";
  }
  var months = Math.floor(totalDays / 30);
  var days = totalDays % 30;
  var monthsText;
  if (months === 1) monthsText = "شهر";
  else if (months === 2) monthsText = "شهران";
  else if (months <= 10) monthsText = months + " أشهر";
  else monthsText = months + " شهرًا";
  if (days === 0) return monthsText;
  var daysText;
  if (days === 1) daysText = "يوم";
  else if (days === 2) daysText = "يومان";
  else if (days <= 10) daysText = days + " أيام";
  else daysText = days + " يومًا";
  return monthsText + " و" + daysText;
}
function statusFor(remainingKm, remainingDays) {
  var timeDue = remainingDays != null && remainingDays <= 0;
  if (remainingKm <= GAUGE_RED_KM || timeDue) return "danger";
  if (remainingKm <= GAUGE_ORANGE_KM) return "warn";
  return "good";
}
var GAUGE_COLORS = { good: "#3FA76C", warn: "#D9A54A", danger: "#C1443B" };
var STATUS_LABEL = { good: "بحالة جيدة", warn: "قاربت على الاستحقاق", danger: "مستحقة الآن" };

function gaugeSVG(percent, status) {
  var clamped = Math.max(0, Math.min(100, percent));
  var radius = 54, circumference = Math.PI * radius;
  var dash = (clamped / 100) * circumference;
  var color = GAUGE_COLORS[status] || GAUGE_COLORS.good;
  var angle = -90 + (clamped / 100) * 180;
  return '<svg viewBox="0 0 140 80" style="width:100%;height:auto;overflow:visible;">' +
    '<path d="M 10 74 A 54 54 0 0 1 130 74" fill="none" stroke="' + '#3E3648' + '" stroke-width="10" stroke-linecap="round"/>' +
    '<path d="M 10 74 A 54 54 0 0 1 130 74" fill="none" stroke="' + color + '" stroke-width="10" stroke-linecap="round" ' +
      'stroke-dasharray="' + dash + ' ' + circumference + '"/>' +
    '<g transform="rotate(' + angle + ' 70 74)">' +
      '<line x1="70" y1="74" x2="70" y2="26" stroke="#F3ECDF" stroke-width="2.5" stroke-linecap="round"/>' +
      '<circle cx="70" cy="74" r="5" fill="#F3ECDF" stroke="#18141C" stroke-width="1.5"/>' +
    '</g></svg>';
}

/* ---------- ICS reminder ---------- */
function buildReminderICS(itemName, remainingKm, remainingDays, currentKm) {
  function pad(n) { return String(n).padStart(2, "0"); }
  var now = new Date();
  var stamp = now.getUTCFullYear() + pad(now.getUTCMonth()+1) + pad(now.getUTCDate()) + "T" +
    pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + "Z";
  var uid = "car-maint-" + Date.now() + "-" + Math.random().toString(36).slice(2,8) + "@car-maintenance";
  var summary = "تذكير صيانة: " + itemName + " تقترب من الاستحقاق";
  var kmDue = remainingKm <= 0, timeDue = remainingDays != null && remainingDays <= 0;
  var description;
  if (kmDue || timeDue) {
    description = "موعد " + itemName + " مستحق الآن. قراءة العداد الحالية: " + formatKm(currentKm) + " كم.";
  } else {
    var parts = ["تبقّى " + formatKm(remainingKm) + " كم"];
    if (remainingDays != null) parts.push("أو " + remainingDays + " يومًا");
    description = parts.join(" ") + " على موعد " + itemName + " (أيهما أقرب). قراءة العداد الحالية: " + formatKm(currentKm) + " كم.";
  }
  return [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Car Maintenance//AR//EN","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:" + uid,"DTSTAMP:" + stamp,"DTSTART:" + stamp,"DTEND:" + stamp,
    "SUMMARY:" + summary,"DESCRIPTION:" + description,
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:" + summary,"END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
}
function downloadReminder(item, remainingKm, remainingDays, currentKm) {
  var ics = buildReminderICS(item.name, remainingKm, remainingDays, currentKm);
  var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = item.id + "-تذكير.ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

function buildDateReminderICS(itemName, endDateISO, remainingDays, price) {
  function pad(n) { return String(n).padStart(2, "0"); }
  var now = new Date();
  var stamp = now.getUTCFullYear() + pad(now.getUTCMonth()+1) + pad(now.getUTCDate()) + "T" +
    pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + "Z";
  var uid = "car-date-" + Date.now() + "-" + Math.random().toString(36).slice(2,8) + "@car-maintenance";
  var summary = "تذكير: " + itemName + " تقترب من الانتهاء";
  var due = remainingDays != null && remainingDays <= 0;
  var description = due
    ? (itemName + " منتهي بتاريخ " + formatDateAr(endDateISO) + ".")
    : (itemName + " ينتهي بتاريخ " + formatDateAr(endDateISO) + " (بعد " + formatDurationAr(remainingDays) + ").");
  if (price) description += " السعر آخر مرة: " + price + ".";
  return [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Car Maintenance//AR//EN","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:" + uid,"DTSTAMP:" + stamp,"DTSTART:" + stamp,"DTEND:" + stamp,
    "SUMMARY:" + summary,"DESCRIPTION:" + description,
    "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:" + summary,"END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
}
function downloadDateReminder(item, remainingDays) {
  var ics = buildDateReminderICS(item.name, item.endDate, remainingDays, item.price);
  var blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = item.id + "-تذكير.ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

/* ---------- Email report ---------- */
function buildFullReportText(items, currentKm, specialItems) {
  var lines = ["تقرير صيانة السيارة — قراءة العداد: " + formatKm(currentKm) + " كم", ""];
  items.forEach(function (it) {
    var since = Math.max(0, (Number(currentKm) || 0) - (Number(it.lastKm) || 0));

    lines.push("  الدورية: كل " + formatKm(it.intervalKm) + " كم" + (it.intervalYears ? " أو " + it.intervalYears + " سنوات" : ""));
    lines.push("  " + (remainingKm <= 0 ? "تجاوز الموعد بـ" : "المتبقي") + ": " + formatKm(Math.abs(remainingKm)) + " كم — " + statusText);
    lines.push("");
  });
  if (specialItems && specialItems.length > 0) {
    specialItems.forEach(function (it) {
      var remainingDays = daysUntil(it.endDate);
      var statusText = it.endDate

      if (it.price) lines.push("  السعر: " + it.price);

var CRC_TABLE = (function () {
  var table = new Uint32Array(256);

    w32(lh, 0, 0x04034b50); w16(lh, 4, 20); w16(lh, 6, 0); w16(lh, 8, 0);
    w16(lh, 10, dt.time); w16(lh, 12, dt.date); w32(lh, 14, crc);
    w32(lh, 18, data.length); w32(lh, 22, data.length);
    w16(lh, 26, nameBytes.length); w16(lh, 28, 0);
    lh.set(nameBytes, 30);
    localParts.push(lh, data);

    var ch = new Uint8Array(46 + nameBytes.length);
    w32(ch, 0, 0x02014b50); w16(ch, 4, 20); w16(ch, 6, 20); w16(ch, 8, 0); w16(ch, 10, 0);
    w16(ch, 12, dt.time); w16(ch, 14, dt.date); w32(ch, 16, crc);
    w32(ch, 20, data.length); w32(ch, 24, data.length);
    w16(ch, 28, nameBytes.length); w16(ch, 30, 0); w16(ch, 32, 0); w16(ch, 34, 0);
    w16(ch, 36, 0); w32(ch, 38, 0); w32(ch, 42, offset);
    ch.set(nameBytes, 46);
    centralParts.push(ch);
    offset += lh.length + data.length;
  });

  var centralSize = centralParts.reduce(function (s, p) { return s + p.length; }, 0);
  var eocd = new Uint8Array(22);
  w32(eocd, 0, 0x06054b50); w16(eocd, 4, 0); w16(eocd, 6, 0);
  w16(eocd, 8, files.length); w16(eocd, 10, files.length);
  w32(eocd, 12, centralSize); w32(eocd, 16, centralStart); w16(eocd, 20, 0);
  var allParts = localParts.concat(centralParts, [eocd]);
  var totalLen = allParts.reduce(function (s, p) { return s + p.length; }, 0);
  var out = new Uint8Array(totalLen), pos = 0;
  allParts.forEach(function (p) { out.set(p, pos); pos += p.length; });

}
function xlsxEscape(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function colLetter(n) {
  var s = "";

}
function buildSheetXML(rows) {
  var xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  rows.forEach(function (rowCells, i) {
    var r = i + 1;
    xml += '<row r="' + r + '">';
    rowCells.forEach(function (cell, ci) {
      var col = colLetter(ci + 1);
      if (typeof cell === "number") xml += '<c r="' + col + r + '"><v>' + cell + '</v></c>';
      else xml += '<c r="' + col + r + '" t="inlineStr"><is><t xml:space="preserve">' + xlsxEscape(cell) + '</t></is></c>';

function buildXLSXBytes(rows, sheetName) {

  var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
    '</Types>';
  var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>';
  var workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
    '<sheets><sheet name="' + xlsxEscape(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>';
  var workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
    '</Relationships>';
  var sheet1 = buildSheetXML(rows);
  var files = [
    { name: "[Content_Types].xml", data: strToBytes(contentTypes) },
    { name: "_rels/.rels", data: strToBytes(rootRels) },
    { name: "xl/workbook.xml", data: strToBytes(workbook) },
    { name: "xl/_rels/workbook.xml.rels", data: strToBytes(workbookRels) },
    { name: "xl/worksheets/sheet1.xml", data: strToBytes(sheet1) }

/* ---------- Save to Keep / notes app ---------- */
// Google Keep has no public API a web page can call to write into it
// directly or attach arbitrary files (it only accepts photos, drawings, and
// voice notes as attachments — not spreadsheets). The honest, working path
// is the phone's native Share sheet with a real .xlsx file attached: Keep
// may or may not accept it (depends on the Keep app version), but Drive,
// Gmail, WhatsApp, Files and most other apps will.
function buildReportRows(items, currentKm, specialItems) {
  var rows = [["القطعة", "آخر تغيير (كم)", "تاريخ آخر تغيير", "الدورية (كم)", "الدورية (سنوات)", "المتبقي (كم)", "الحالة"]];
  items.forEach(function (it) {
    var t = computeTiming(it, currentKm);
    var lastKm = (it.lastKm === "" || it.lastKm == null) ? "" : Number(it.lastKm);
    rows.push([
      it.name,
      lastKm === "" ? "" : lastKm,
      it.lastDate || "",
      it.intervalKm,
      it.intervalYears || "",
      Math.round(t.remainingKm),
      STATUS_LABEL[t.status]
    ]);
  });
  if (specialItems && specialItems.length > 0) {
    rows.push([]);
    rows.push(["البند", "من", "إلى", "السعر", "الحالة"]);
    specialItems.forEach(function (it) {
      var remainingDays = daysUntil(it.endDate);
      var statusText = it.endDate ? STATUS_LABEL[statusForDateRange(remainingDays)] : "لم يُدخل بعد";
      rows.push([it.name, it.startDate || "", it.endDate || "", it.price || "", statusText]);
    });
  }
  return rows;
}

function saveToNotesApp(items, currentKm, specialItems) {
  var rows = buildReportRows(items, currentKm, specialItems);
  var bytes = buildXLSXBytes(rows, "صيانة السيارة");
  var blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  var filename = "بيانات-صيانة-السيارة.xlsx";

  function fallbackDownload() {
    downloadBlob(blob, filename);
    alert("تم تنزيل ملف Excel إلى مجلد التنزيلات في هاتفك — افتحه من هناك وشاركه يدويًا بالتطبيق الذي تريد.");
  }

  var canTryShare = false;
  var file = null;
  try {
    if (navigator.share && navigator.canShare) {
      file = new File([blob], filename, { type: blob.type });
      canTryShare = navigator.canShare({ files: [file] });
    }
  } catch (e) {
    canTryShare = false;
  }

  if (canTryShare) {
    navigator.share({ title: "بيانات صيانة السيارة", files: [file] }).catch(function (err) {
      // AbortError just means the person closed the share sheet themselves —
      // anything else is a real failure, so fall back to a plain download.
      if (err && err.name === "AbortError") return;
      fallbackDownload();
    });
    return;
  }

  // This browser can't share files at all (no Web Share API support, or it
  // rejected this file type) — download it instead, with a visible
  // confirmation so it's clear something actually happened.
  fallbackDownload();
}

function downloadBlob(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

// Runs right after a save/mark-today click, so it still counts as a direct
// result of the person's tap — this is what lets navigator.share() work
// without a separate button press. It still can't be silent: the mail app
// and the share sheet both open for the person to confirm themselves.
function runAutoSend() {
  if (!state.autoSend) return;
  if (state.email) sendReportEmail(state.email, state.items, state.currentKm, state.specialItems);
  try {
    saveToNotesApp(state.items, state.currentKm, state.specialItems);
  } catch (e) { /* the manual button already surfaces errors; stay quiet here */ }
}

/* ---------- Render ---------- */
function computeTiming(item, currentKm) {
  var sinceChange = Math.max(0, (Number(currentKm) || 0) - (Number(item.lastKm) || 0));
  var remainingKm = item.intervalKm - sinceChange;
  var kmPercentUsed = item.intervalKm > 0 ? (sinceChange / item.intervalKm) * 100 : 0;
  var hasYears = !!item.intervalYears;
  var daysSince = (hasYears && item.lastDate) ? daysBetween(item.lastDate, new Date()) : null;
  var totalDaysAllowed = hasYears ? item.intervalYears * 365 : null;
  var remainingDays = (hasYears && daysSince != null) ? totalDaysAllowed - daysSince : null;
  var timePercentUsed = (hasYears && daysSince != null) ? (daysSince / totalDaysAllowed) * 100 : null;
  var dueDate = (hasYears && item.lastDate) ? addYearsISO(item.lastDate, item.intervalYears) : null;
  var percentUsed = timePercentUsed != null ? Math.max(kmPercentUsed, timePercentUsed) : kmPercentUsed;
  var status = statusFor(remainingKm, remainingDays);
  return { sinceChange: sinceChange, remainingKm: remainingKm, hasYears: hasYears, remainingDays: remainingDays,
    dueDate: dueDate, percentUsed: percentUsed, status: status };
}

        priceFieldHTML +
        '<label>تاريخ البداية<input type="date" id="start-in-' + item.id + '" value="' + (item.startDate || todayISO()) + '"/></label>' +
        '<label>تاريخ النهاية<input type="date" id="end-in-' + item.id + '" value="' + (item.endDate || "") + '"/></label>' +
        '<div class="edit-actions">' +
          '<button class="save-btn" data-action="date-save" data-id="' + item.id + '">حفظ</button>' +
          '<button class="cancel-btn" data-action="date-cancel" data-id="' + item.id + '">إلغاء</button>' +
        '</div>' +
      '</div>';
  } else {
    editHTML =
      '<div class="action-row">' +
        '<button class="mark-btn" data-action="date-renew" data-id="' + item.id + '">تجديد لسنة من اليوم</button>' +
        '<button class="edit-btn" data-action="date-edit" data-id="' + item.id + '">تعديل</button>' +
      '</div>';
  }

  return (
    '<div class="card ' + status + '">' +
      '<div class="card-head">' +
        '<div class="card-title">' +
          '<div class="card-icon">' + svgIcon(item.icon, "") + '</div>' +
          '<div><h3>' + item.name + '</h3><p>' + subtitle + '</p></div>' +
        '</div>' +
        '<span class="badge ' + status + '">' + svgIcon(status === "good" ? "check" : "warn", "") + ' ' + STATUS_LABEL[status] + '</span>' +
      '</div>' +
      periodHTML +
      remainingHTML +
      priceHTML +
      remindHTML +
      editHTML +
    '</div>'
  );
}

function renderApp() {
  var dueCount = 0, soonCount = 0;
  state.items.forEach(function (it) {
    var t = computeTiming(it, state.currentKm);
    var due = t.remainingKm <= GAUGE_RED_KM || (t.remainingDays != null && t.remainingDays <= 0);
    if (due) dueCount++;
    else if (t.remainingKm <= GAUGE_ORANGE_KM) soonCount++;
  });
  state.specialItems.forEach(function (it) {
    if (!it.endDate) return;
    var remainingDays = daysUntil(it.endDate);
    var status = statusForDateRange(remainingDays);
    if (status === "danger") dueCount++;
    else if (status === "warn") soonCount++;
  });

  var emailSection = "";
  if (state.showEmail) {
    emailSection =
      '<div class="panel email-panel">' +
        '<div style="flex:1;"><label class="field-label">البريد الإلكتروني لإرسال تقرير الصيانة</label>' +
          '<input type="email" id="email-input" value="' + (state.email || "") + '" placeholder="example@email.com"/></div>' +
        '<button class="btn btn-primary" id="send-report-btn" ' + (state.email ? '' : 'disabled') + '>إرسال التقرير الآن</button>' +
      '</div>' +
      '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-mid);margin:-8px 0 8px;cursor:pointer;">' +
        '<input type="checkbox" id="auto-send-toggle" ' + (state.autoSend ? "checked" : "") + ' style="width:16px;height:16px;"/>' +
        'فتح البريد وقائمة مشاركة Excel تلقائيًا بعد كل تغيير' +
      '</label>' +
      '<p class="hint">سيفتح هذا تطبيق البريد على هاتفك برسالة جاهزة تضم كل بيانات الصيانة — لأسباب أمنية لا يمكن لأي صفحة ويب إرسال البريد أو حفظ ملاحظة في Keep تلقائيًا بصمت دون أن تضغط أنت زر الإرسال بنفسك في التطبيق الذي يُفتح.</p>';
  }

  var html =
    '<div class="wrap">' +
      '<div class="header-row">' +
        '<div><div class="eyebrow">' + svgIcon("gauge", "") + '<span>لوحة متابعة الصيانة</span></div><h1>صيانة سيارتي</h1></div>' +
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">' +
          '<button class="icon-btn' + (state.showEmail ? ' active' : '') + '" id="toggle-email-btn" title="إرسال تقرير بالبريد الإلكتروني">' + svgIcon("mail", "") + '</button>' +
          '<button class="icon-btn" id="save-notes-btn" title="مشاركة تقرير Excel للصيانة">' + svgIcon("note", "") + '</button>' +
          '<p class="save-note" id="save-note"></p>' +
        '</div>' +
      '</div>' +
      '<div class="panel odo-row">' +
        '<div style="flex:1;"><label class="field-label">قراءة العداد الحالية (كم)</label>' +
          '<input type="number" inputmode="numeric" class="odo-input" id="current-km-input" value="' + (state.currentKm === "" ? "" : state.currentKm) + '" placeholder="مثال: 45000"/></div>' +
        '<div class="stat-pair">' +
          '<div class="stat-box"><b style="color:var(--danger);">' + dueCount + '</b><small>مستحقة</small></div>' +
          '<div class="stat-box"><b style="color:var(--warn);">' + soonCount + '</b><small>قريبة</small></div>' +
        '</div>' +
      '</div>' +
      emailSection +
      '<div class="grid">' + state.items.map(cardHTML).join("") + '</div>' +
      '<h2 style="font-family:\'Cairo\',sans-serif;font-weight:800;font-size:16px;color:var(--text-mid);margin:26px 0 12px;">التأمين والفحص التقني</h2>' +
      '<div class="grid">' + state.specialItems.map(specialCardHTML).join("") + '</div>' +
      '<p class="footer-note">بياناتك محفوظة تلقائيًا على هذا الجهاز</p>' +
    '</div>';

  document.getElementById("root").innerHTML = html;
  renderSaveNote();
}

/* ---------- Events (delegated) ---------- */
document.addEventListener("click", function (e) {
  var btn = e.target.closest("[data-action]");
  if (btn) {
    var action = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");
    var item = state.items.find(function (it) { return it.id === id; });

    if (action === "edit") { state.editingId = id; renderApp(); return; }
    if (action === "cancel") { state.editingId = null; renderApp(); return; }

    if (action === "save" && item) {
      var kmVal = document.getElementById("km-in-" + id).value;
      var dateVal = document.getElementById("date-in-" + id).value;
      var intervalVal = document.getElementById("interval-in-" + id).value;
      var yearsVal = document.getElementById("years-in-" + id).value;
      var newLastKm = kmVal === "" ? "" : (Number(kmVal) || 0);
      var changed = newLastKm !== item.lastKm || dateVal !== item.lastDate;
      if (changed) item.history = pushToHistory(item);
      item.lastKm = newLastKm;
      item.lastDate = dateVal;
      item.intervalKm = Number(intervalVal) || item.intervalKm;
      item.intervalYears = yearsVal === "" ? null : (Number(yearsVal) || null);
      state.editingId = null;
      persist(); renderApp();
      if (changed) runAutoSend();
      return;
    }

    if (action === "mark-today" && item) {
      var km = Number(state.currentKm) || 0;
      item.history = pushToHistory(item);
      item.lastKm = km;
      item.lastDate = todayISO();
      persist(); renderApp();
      runAutoSend();
      return;
    }

    if (action === "remind" && item) {
      var t = computeTiming(item, state.currentKm);
      downloadReminder(item, t.remainingKm, t.remainingDays, state.currentKm);
      return;
    }

    var specialItem = state.specialItems.find(function (it) { return it.id === id; });

    if (action === "date-edit" && specialItem) { state.editingId = id; renderApp(); return; }
    if (action === "date-cancel" && specialItem) { state.editingId = null; renderApp(); return; }

    if (action === "date-save" && specialItem) {
      var startVal = document.getElementById("start-in-" + id).value;
      var endVal = document.getElementById("end-in-" + id).value;
      var priceEl = document.getElementById("price-in-" + id);
      var changedDate = startVal !== specialItem.startDate || endVal !== specialItem.endDate;
      specialItem.startDate = startVal;
      specialItem.endDate = endVal;
      if (priceEl) specialItem.price = priceEl.value;
      state.editingId = null;
      persist(); renderApp();
      if (changedDate) runAutoSend();
      return;
    }

    if (action === "date-renew" && specialItem) {
      var todayVal = todayISO();
      var nextYear = addYearsISO(todayVal, 1);
      specialItem.startDate = todayVal;
      specialItem.endDate = nextYear ? nextYear.toISOString().slice(0, 10) : "";
      persist(); renderApp();
      runAutoSend();
      return;
    }

    if (action === "date-remind" && specialItem) {
      var remainingDays = daysUntil(specialItem.endDate);
      downloadDateReminder(specialItem, remainingDays);
      return;
    }
  }

  if (e.target.closest("#toggle-email-btn")) { state.showEmail = !state.showEmail; renderApp(); return; }
  if (e.target.closest("#save-notes-btn")) {
    try {
      saveToNotesApp(state.items, state.currentKm, state.specialItems);
    } catch (err) {
      alert("تعذّر إنشاء ملف Excel:\n" + (err && err.message ? err.message : String(err)));
    }
    return;
  }
  if (e.target.id === "send-report-btn") { sendReportEmail(state.email, state.items, state.currentKm, state.specialItems); return; }
});

document.addEventListener("input", function (e) {
  if (e.target.id === "current-km-input") {
    // Just update the state while typing — do NOT re-render here.
    // type="number" inputs don't support setSelectionRange, so a full
    // re-render mid-typing throws the caret to the wrong place and makes
    // digits appear out of order. The full re-render (which updates every
    // card's gauge/remaining numbers) happens on "change" below, once the
    // person finishes editing the field.
    var v = e.target.value;
    state.currentKm = v === "" ? "" : Number(v);
    persist();
  }
  if (e.target.id === "email-input") {
    state.email = e.target.value;
    persist();
    // Only the disabled-state of the send button depends on this; toggle it
    // directly instead of a full re-render so the input never loses focus.
    var sendBtn = document.getElementById("send-report-btn");
    if (sendBtn) sendBtn.disabled = !state.email;
  }
  if (e.target.id === "auto-send-toggle") {
    state.autoSend = e.target.checked;
    persist();
  }
  if (e.target.id && e.target.id.indexOf("start-in-") === 0) {
    var itemId = e.target.id.slice("start-in-".length);
    var specialItem = state.specialItems.find(function (it) { return it.id === itemId; });
    if (specialItem && e.target.value) {
      var endEl = document.getElementById("end-in-" + itemId);
      var nextYear = addYearsISO(e.target.value, 1);
      if (endEl && nextYear) endEl.value = nextYear.toISOString().slice(0, 10);
    }
  }
});

document.addEventListener("change", function (e) {
  if (e.target.id === "current-km-input") {
    // Now that the person is done editing this field (moved on to something
    // else), do the full re-render so every card's gauge/remaining figures
    // catch up to the new reading.
    renderApp();
  }
});

/* ---------- Init ---------- */
loadState();
renderApp();

/* ---------- PWA install + auto-update ---------- */
// Registering this lets the browser offer a real "Install" prompt (in
// addition to "Add to Home Screen") and lets service-worker.js pick up a
// fresh index.html automatically next time the app is opened online —
// updating never requires deleting the installed app first.
if ("serviceWorker" in navigator) {
  try {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  } catch (e) { /* unsupported browser — app still works fine without it */ }
}
</script>
</body>
</html>
